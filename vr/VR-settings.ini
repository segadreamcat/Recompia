; Merge these keys into the matching sections of your existing pkp.ini.
; Keep your own fs, mods and save paths. The local installation already contains these values.
[pkp]
vr_first_person = 1
vr_auto_reading = 0
vr_shortcuts = 1
vr_sharpness = 0.65
vr_hud_scale = 0.55

[vr]
mirror_x = 0
panel_distance = 2.5
panel_width = 2.4
